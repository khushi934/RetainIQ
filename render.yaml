services:
  - type: web
    name: retainiq-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        sync: false   # set in Render dashboard
      - key: DATABASE_URL
        sync: false   # set in Render dashboard (PlanetScale / Aiven / Railway MySQL)
      - key: FRONTEND_URL
        sync: false   # set to your Vercel URL, e.g. https://retainiq.vercel.app
      - key: LLM_API_KEY
        sync: false   # set in Render dashboard
      - key: LLM_MODEL
        value: gpt-3.5-turbo
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
    healthCheckPath: /api/health
    autoDeploy: true
